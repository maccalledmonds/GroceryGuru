services:
  - type: web
    name: pantrypal-api
    runtime: python
    region: oregon
    plan: free
    rootDir: .
    buildCommand: |
      pip install -r backend/requirements.txt &&
      python -m spacy download en_core_web_sm
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: USDA_API_KEY
        sync: false          # set manually in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false          # set to your Vercel URL after first deploy
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHON_VERSION
        value: "3.11.0"
